services:
  - type: web
    name: insightara-site
    env: python
    plan: free

    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"

    startCommand: "gunicorn insightara_site.wsgi:application"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: DATABASE_URL
        fromDatabase:
          name: insightara-db
          property: connectionString

databases:
  - name: insightara-db
    plan: free